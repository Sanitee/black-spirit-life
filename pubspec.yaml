name: bdo_craft_planner_flutter
description: Free unofficial Windows-first Black Spirit Life companion
publish_to: none
version: 0.1.4+23

environment:
  sdk: ^3.12.2

dependencies:
  bdo_map_core:
    path: packages/bdo_map_core
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  image: ^4.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/app-data.json
    - assets/scenes/
    - assets/ledger/
    - assets/app/
    - assets/sakura/botanicals/
    - assets/sakura/materials/
