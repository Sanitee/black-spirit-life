name: Report a mistake or request removal
description: Tell us about wrong information, missing credits, privacy or content rights.
title: "[Content] "
labels: [content-review]
body:
  - type: markdown
    attributes:
      value: This report is public. Do not include private information or confidential proof.
  - type: input
    id: affected_material
    attributes:
      label: What is affected?
      description: Name the item, screen or file. Add a link if you have one.
    validations:
      required: true
  - type: dropdown
    id: request_type
    attributes:
      label: What needs fixing?
      options:
        - Wrong information
        - Missing or wrong source credits
        - Copyright or other content rights
        - Remove content
        - Private or personal information
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: What is wrong?
      description: Explain briefly. Link to public evidence if possible.
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: What should change?
    validations:
      required: true
  - type: checkboxes
    id: public_acknowledgement
    attributes:
      label: Before posting
      options:
        - label: This report contains no private information or confidential proof.
          required: true
